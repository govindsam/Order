<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JSON Image Viewer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 25px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #222;
      color: white;
    }

    td img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Products</h1>

  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>

  <script>
    fetch("data.json")
      .then(response => response.json())
      .then(data => {

        if (!data.length) return;

        const table = document.getElementById("dataTable");
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");

        // Get all column names from JSON
        const columns = Object.keys(data[0]);

        // Create table header
        const headerRow = document.createElement("tr");

        // Image column
        const imageHeader = document.createElement("th");
        imageHeader.textContent = "Image";
        headerRow.appendChild(imageHeader);

        // JSON columns
        columns.forEach(column => {
          const th = document.createElement("th");
          th.textContent = column;
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);

        // Create rows
        data.forEach(item => {

          const row = document.createElement("tr");

          // Image
          const imageCell = document.createElement("td");

          const img = document.createElement("img");

          // Match image with name
          img.src = `images/${item.name}.jpg`;
          img.alt = item.name;

          imageCell.appendChild(img);
          row.appendChild(imageCell);

          // Other JSON information
          columns.forEach(column => {

            const cell = document.createElement("td");

            // Handle objects/arrays too
            if (typeof item[column] === "object") {
              cell.textContent = JSON.stringify(item[column]);
            } else {
              cell.textContent = item[column];
            }

            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });

      })
      .catch(error => {
        console.error("Error loading JSON:", error);
      });
  </script>

</body>
</html>
